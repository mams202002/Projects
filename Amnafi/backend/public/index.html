<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMNAFI</title>
    
    <!-- Typographie Moderne -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Feuillets de style -->
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">



    
</head>
<body>
    <div class="container">
        <header>
            <h1>AMNAFI</h1>
            <p class="subtitle">Annuaire des établissements et commerces sénégalais en France</p>
        </header>
        
        <div id="status-message" class="error"></div>
        
        <div class="controls">
            <button id="btn-load" class="btn-primary">Charger les données</button>
        </div>

        <div class="tabs-container">
            <div class="tabs" id="tabs" style="display:none">
                <button class="tab active" data-cat="tous">Tous <span class="badge" id="count-tous">0</span></button>
                <button class="tab" data-cat="restaurants">Restaurants <span class="badge" id="count-restaurants">0</span></button>
                <button class="tab" data-cat="associations">Associations <span class="badge" id="count-associations">0</span></button>
                <button class="tab" data-cat="commerces">Commerces <span class="badge" id="count-commerces">0</span></button>
                <button class="tab" data-cat="coiffure">Coiffure <span class="badge" id="count-coiffure">0</span></button>
                <button class="tab" data-cat="autres">Autres <span class="badge" id="count-autres">0</span></button>
            </div>
        </div>

        <div class="table-card">
            <table id="resultats">
                <thead>
                    <tr>
                        <th class="col-index">#</th>
                        <th>Enseigne</th>
                        <th>Adresse</th>
                        <th>CP</th>
                        <th>Catégorie</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Injection dynamique via script.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script JS côté client -->
    <script src="script.js"></script>
</body>
</html>
